name: Julia tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Run numerical and CairoMakie tests
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.Registry.add("General")
            Pkg.Registry.add(url="https://github.com/astro-group-bristol/AstroRegistry")
            Pkg.instantiate()
            Pkg.test()
          '
